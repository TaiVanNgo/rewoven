name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release that has started migrating must finish before another can start.
concurrency:
  group: rewoven-production
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Migrate and deploy
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://rewoven.dev
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify production settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the GitHub production environment."
              exit 1
            fi
          done

      - name: Reject an outdated release
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::main has advanced. Release the newest commit instead."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@64.2.0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Verify the Vercel project and pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.vercel/project.json', JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID }));
          NODE
          vercel project inspect --non-interactive
          node --input-type=module <<'NODE'
          const endpoint = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(process.env.VERCEL_PROJECT_ID)}`);
          endpoint.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) throw new Error(`Vercel project verification failed (${response.status}).`);
          const project = await response.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID || project.accountId !== process.env.VERCEL_ORG_ID) {
            throw new Error('Vercel project or owner does not match the configured production target.');
          }
          if (project.link?.type !== 'github' || `${project.link.org}/${project.link.repo}` !== process.env.GITHUB_REPOSITORY) {
            throw new Error('The Vercel project must be connected to this GitHub repository.');
          }
          if (project.link?.productionBranch && project.link.productionBranch !== 'main') {
            throw new Error('This workflow releases main; Vercel must use the same production branch.');
          }
          if (project.nodeVersion !== '22.x') {
            throw new Error('Set the Vercel project Node.js version to 22.x to match the prebuilt application.');
          }
          NODE
          vercel pull --yes --environment=production --non-interactive

      - name: Build with production configuration
        run: vercel build --prod --non-interactive

      - name: Apply pending production migrations and storage configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --dry-run
          supabase db push --linked --yes
          supabase seed buckets --linked --yes

      - name: Stage a production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --non-interactive --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const value = process.env.DEPLOYMENT_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.origin !== value || !url.hostname.endsWith('.vercel.app')) {
            throw new Error('Vercel did not return a valid deployment origin.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url.origin}\n`);
          NODE

      - name: Verify the staged deployment and database connection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel inspect "$DEPLOYMENT_URL" --json --non-interactive > .vercel/staged-deployment.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const deployment = JSON.parse(readFileSync('.vercel/staged-deployment.json', 'utf8'));
          if (deployment.target !== 'production' || deployment.readyState !== 'READY' || `https://${deployment.url}` !== process.env.DEPLOYMENT_URL) {
            throw new Error('The staged production deployment is not ready.');
          }
          NODE
          vercel curl / --deployment "$DEPLOYMENT_URL" --non-interactive -- --fail --silent --show-error --max-time 60 --output /dev/null
          vercel curl /api/demo-session --deployment "$DEPLOYMENT_URL" --non-interactive -- --request POST --fail --silent --show-error --max-time 60 --output "$RUNNER_TEMP/rewoven-session.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const session = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/rewoven-session.json`, 'utf8'));
          if (!Number.isFinite(Date.parse(session.expiresAt)) || Date.parse(session.expiresAt) <= Date.now()) {
            throw new Error('The production API could not create a database-backed demo session.');
          }
          NODE

      - name: Promote the verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during this release. Leave the existing production deployment live."
            exit 1
          fi
          vercel promote "$DEPLOYMENT_URL" --yes --non-interactive
          {
            echo "### Production release"
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Site: https://rewoven.dev"
            echo "- Pending migrations and declared storage buckets applied before promotion."
            echo "- Homepage and database-backed session checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
